# Postgres local para desarrollo. En producción usa Supabase/Neon.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: planify
      POSTGRES_PASSWORD: planify
      POSTGRES_DB: planify
    ports:
      - "5432:5432"
    volumes:
      - planify_pgdata:/var/lib/postgresql/data

volumes:
  planify_pgdata:
